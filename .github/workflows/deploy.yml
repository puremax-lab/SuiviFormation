name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # GitHub Pages serves 404.html for unknown paths: reuse the app so deep links work.
      - run: cp dist/suivi-formation/browser/index.html dist/suivi-formation/browser/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/suivi-formation/browser

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
