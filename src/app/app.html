<header class="topbar">
  <div class="container topbar-inner">
    <a routerLink="/" class="brand">
      <span class="brand-mark" aria-hidden="true">✓</span>
      SuiviFormation
    </a>

    <nav class="main-nav" aria-label="Navigation principale">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="label-long">Tableau de bord</span><span class="label-short">Accueil</span>
      </a>
      <a routerLink="/sessions" routerLinkActive="active">Sessions</a>
      <a routerLink="/stagiaires" routerLinkActive="active">Stagiaires</a>
      <a routerLink="/presences" routerLinkActive="active">Présences</a>
    </nav>

    <label class="role-switch">
      <span>Rôle</span>
      <select (change)="changeRole($any($event.target).value)">
        <option value="admin" [selected]="roles.role() === 'admin'">Administrateur</option>
        <option value="trainer" [selected]="roles.role() === 'trainer'">Formateur</option>
      </select>
    </label>
  </div>
</header>

<main class="container page">
  <router-outlet />
</main>

<footer class="container footer">
  <p>
    Données de démonstration enregistrées dans votre navigateur.
    @if (roles.isAdmin()) {
      <button type="button" class="link-button" (click)="resetDemo()">Réinitialiser la démo</button>
    }
  </p>
  <nav class="footer-links" aria-label="Liens du pied de page">
    <span>Projet portfolio de puremax-lab</span>
    <a href="https://github.com/puremax-lab/SuiviFormation" target="_blank" rel="noopener">Code source</a>
    <a href="https://github.com/puremax-lab" target="_blank" rel="noopener">GitHub puremax-lab</a>
    <a routerLink="/mentions-legales">Mentions légales</a>
  </nav>
</footer>
